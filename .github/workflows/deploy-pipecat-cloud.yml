name: Deploy to Pipecat Cloud

on:
  push:
    branches: [main-deploy]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and Push to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/pipecat-telesales-agent:latest,${{ secrets.DOCKER_HUB_USERNAME }}/pipecat-telesales-agent:${{ github.sha }}
      
      - name: Notify Deployment
        run: echo "Deployed to Docker Hub - pipecat-telesales-agent:latest"
